<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Commentaires – NovaSpace</title>
    <link rel="stylesheet" href="../novaspace.css">
</head>

<body>

<div class="layout">

    <!-- ─────────── Sidebar ─────────── -->
    <div class="sidebar">
        <a class="logo" href="../index.html">
            <div class="logo-mark"></div>
            NovaSpace
        </a>

        <div class="nav">
            <a class="nav-item" href="projects.html">Projets</a>
            <a class="nav-item" href="messages.html">Messagerie</a>
            <a class="nav-item" href="notifications.html">Notifications</a>
            <a class="nav-item" href="profile.html">Profil</a>
        </div>

        <div class="sidebar-bottom">
            <div class="user-row">
                <div class="avatar" id="avatar"></div>
                <div>
                    <div class="user-name" id="usernameDisplay"></div>
                    <div class="user-handle">@nova</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ─────────── Main ─────────── -->
    <div class="main">

        <div style="flex:1; max-width:700px; margin:auto;">

            <!-- Header -->
            <div class="feed-header">
                <div class="feed-title">Commentaires</div>
            </div>

            <!-- Projet affiché -->
            <div id="projectBox" class="post" style="margin-top:10px;"></div>

            <!-- Ajouter un commentaire -->
            <div class="compose" style="flex-direction:column; gap:10px;">
                <textarea id="commentInput" class="compose-input" placeholder="Écris un commentaire..."></textarea>
                <button class="btn-primary" onclick="publishComment()" style="align-self:flex-end;">
                    Publier
                </button>
            </div>

            <!-- Liste des commentaires -->
            <div id="commentsList"></div>

        </div>

    </div>

</div>

<script src="../app.js"></script>

<script>

    // ─────────── Récupération de l'utilisateur connecté ───────────
    const user = localStorage.getItem("username");
    if (!user) window.location.href = "login.html";

    document.getElementById("usernameDisplay").innerText = user;
    document.getElementById("avatar").innerText = user[0].toUpperCase();


    // ─────────── Récupération de l'ID du projet ───────────
    const urlParams = new URLSearchParams(window.location.search);
    const projectId = urlParams.get("id");


    // ─────────── Charger le projet (titre + description) ───────────
    async function loadProject() {
        const projects = await getAllProjects();
        const p = projects.find(pr => pr.id == projectId);

        if (!p) return;

        document.getElementById("projectBox").innerHTML = `
            <div class="post-header">
                <div class="post-avatar" style="background:var(--accent);">
                    ${p.author[0].toUpperCase()}
                </div>
                <div class="post-meta">
                    <div class="post-author">${p.author}</div>
                    <div class="post-time">${new Date(p.created_at).toLocaleString()}</div>
                </div>
            </div>

            <div class="post-title">${p.title}</div>
            <div class="post-body">${p.description}</div>
        `;
    }


    // ─────────── Publier un commentaire ───────────
    async function publishComment() {
        const content = document.getElementById("commentInput").value;
        if (!content) return;

        await addComment(projectId, user, content);

        document.getElementById("commentInput").value = "";
        loadComments();
    }


    // ─────────── Charger les commentaires ───────────
    async function loadComments() {
        const comments = await getComments(projectId);
        const list = document.getElementById("commentsList");

        list.innerHTML = "";

        comments.forEach(c => {
            list.innerHTML += `
                <div class="post">
                    <div class="post-header">
                        <div class="post-avatar" style="background:var(--accent);">
                            ${c.author[0].toUpperCase()}
                        </div>
                        <div class="post-meta">
                            <div class="post-author">${c.author}</div>
                            <div class="post-time">${new Date(c.created_at).toLocaleString()}</div>
                        </div>
                    </div>

                    <div class="post-body">${c.content}</div>
                </div>
            `;
        });
    }


    // ─────────── Initialisation ───────────
    loadProject();
    loadComments();

</script>

</body>
</html>
