<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Notifications – NovaSpace</title>
    <link rel="stylesheet" href="../novaspace.css">
</head>

<body>

<div class="layout">

    <!-- ─────────── Sidebar ─────────── -->
    <div class="sidebar">
        <a class="logo" href="../index.html">
            <div class="logo-mark"></div>
            NovaSpace
        </a>

        <div class="nav">
            <a class="nav-item" href="projects.html">Projets</a>
            <a class="nav-item" href="messages.html">Messagerie</a>
            <a class="nav-item active" href="notifications.html">Notifications</a>
            <a class="nav-item" href="profile.html">Profil</a>
        </div>

        <div class="sidebar-bottom">
            <div class="user-row">
                <div class="avatar" id="avatar"></div>
                <div>
                    <div class="user-name" id="usernameDisplay"></div>
                    <div class="user-handle">@nova</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ─────────── Main Notifications ─────────── -->
    <div class="main">

        <div style="flex:1; max-width:700px; margin:auto;">

            <!-- Header -->
            <div class="feed-header">
                <div class="feed-title">Notifications</div>
            </div>

            <!-- Liste des notifications -->
            <div id="notifList"></div>

        </div>

    </div>

</div>

<script src="../app.js"></script>

<script>

    // ─────────── Récupération utilisateur ───────────
    const user = localStorage.getItem("username");
    if (!user) window.location.href = "login.html";

    document.getElementById("usernameDisplay").innerText = user;
    document.getElementById("avatar").innerText = user[0].toUpperCase();


    // ─────────── Charger les notifications ───────────
    async function loadNotifications() {
        const list = document.getElementById("notifList");
        list.innerHTML = "";

        const notifs = await getNotifications(user);

        if (notifs.length === 0) {
            list.innerHTML = `
                <div class="post" style="text-align:center;color:var(--text-3);">
                    Aucune notification pour le moment
                </div>
            `;
            return;
        }

        notifs.forEach(n => {
            list.innerHTML += `
                <div class="post" style="border-left:4px solid ${n.is_read ? 'transparent' : 'var(--accent)'};">
                    
                    <div class="post-header">
                        <div class="post-avatar" style="background:var(--accent);">
                            !
                        </div>
                        <div class="post-meta">
                            <div class="post-author">${n.type}</div>
                            <div class="post-time">${new Date(n.created_at).toLocaleString()}</div>
                        </div>
                    </div>

                    <div class="post-body">${n.message}</div>

                    <div class="post-actions">
                        ${n.is_read 
                            ? "" 
                            : `<button class="btn-ghost" onclick="markRead(${n.id})">Marquer comme lu</button>`
                        }
                        <button class="btn-ghost" onclick="deleteNotif(${n.id})">Supprimer</button>
                    </div>

                </div>
            `;
        });
    }


    // ─────────── Marquer comme lu ───────────
    async function markRead(id) {
        await fetch(`http://127.0.0.1:8000/notifications/read/${id}`, {
            method: "POST"
        });
        loadNotifications();
    }


    // ─────────── Supprimer une notification ───────────
    async function deleteNotif(id) {
        await fetch(`http://127.0.0.1:8000/notifications/${id}`, {
            method: "DELETE"
        });
        loadNotifications();
    }


    // ─────────── Initialisation ───────────
    loadNotifications();

</script>

</body>
</html>
