<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Profil – NovaSpace</title>
    <link rel="stylesheet" href="../novaspace.css">
</head>

<body>

<div class="layout">

    <!-- ─────────── Sidebar ─────────── -->
    <div class="sidebar">
        <a class="logo" href="../index.html">
            <div class="logo-mark"></div>
            NovaSpace
        </a>

        <div class="nav">
            <a class="nav-item" href="projects.html">Projets</a>
            <a class="nav-item" href="messages.html">Messagerie</a>
            <a class="nav-item" href="notifications.html">Notifications</a>
            <a class="nav-item active" href="profile.html">Profil</a>
        </div>

        <div class="sidebar-bottom">
            <div class="user-row">
                <div class="avatar" id="avatar"></div>
                <div>
                    <div class="user-name" id="usernameDisplay"></div>
                    <div class="user-handle">@nova</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ─────────── Main Profil ─────────── -->
    <div class="main">

        <div class="profile-main">

            <!-- Bannière -->
            <div class="profile-cover"></div>

            <!-- Infos utilisateur -->
            <div class="profile-info">

                <div class="profile-avatar-wrap">
                    <div class="profile-avatar" id="profileAvatar"></div>
                </div>

                <button class="edit-profile-btn">Modifier le profil</button>

                <div class="profile-name" id="profileName"></div>
                <div class="profile-handle">@nova</div>

                <div class="profile-bio" id="profileBio">
                    Aucune bio pour le moment.
                </div>

                <div class="profile-meta">
                    <span>📍 France</span>
                    <span>🚀 Membre NovaSpace</span>
                </div>

                <div class="profile-stats">
                    <div class="stat">
                        <span class="stat-num" id="projectCount">0</span>
                        <span class="stat-label">projets</span>
                    </div>
                </div>

            </div>

            <!-- Projets de l'utilisateur -->
            <div class="profile-tabs">
                <div class="tab active">Projets</div>
            </div>

            <div class="profile-projects" id="userProjects"></div>

        </div>

    </div>

</div>

<script src="../app.js"></script>

<script>

    // ─────────── Récupération utilisateur ───────────
    const user = localStorage.getItem("username");
    if (!user) window.location.href = "login.html";

    document.getElementById("usernameDisplay").innerText = user;
    document.getElementById("avatar").innerText = user[0].toUpperCase();
    document.getElementById("profileAvatar").innerText = user[0].toUpperCase();
    document.getElementById("profileName").innerText = user;


    // ─────────── Charger les projets de l'utilisateur ───────────
    async function loadUserProjects() {
        const all = await getAllProjects();
        const mine = all.filter(p => p.author === user);

        document.getElementById("projectCount").innerText = mine.length;

        const container = document.getElementById("userProjects");
        container.innerHTML = "";

        mine.forEach(p => {
            container.innerHTML += `
                <div class="profile-project" onclick="openProject(${p.id})">
                    <div class="project-thumb"></div>
                    <div class="project-info">
                        <div class="project-title">${p.title}</div>
                        <div class="project-meta">${new Date(p.created_at).toLocaleDateString()}</div>
                    </div>
                </div>
            `;
        });
    }

    function openProject(id) {
        window.location.href = "project_comments.html?id=" + id;
    }

    loadUserProjects();

</script>

</body>
</html>
