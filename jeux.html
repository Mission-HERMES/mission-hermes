<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test de réactivité</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Test de réactivité</h1>
    <p id="instructions">
      Clique sur le carré <strong>dès qu'il devient vert</strong>.
    </p>

    <div id="box"></div>

    <button id="startBtn">Lancer le test</button>

    <p id="result"></p>
  </div>

  <script>
    const box = document.getElementById('box');
    const startBtn = document.getElementById('startBtn');
    const result = document.getElementById('result');
    const instructions = document.getElementById('instructions');

    let timeoutId = null;
    let startTime = null;
    let ready = false;

    function resetBox() {
      box.style.backgroundColor = '#c0392b'; // rouge
      box.style.cursor = 'not-allowed';
      ready = false;
    }

    function startTest() {
      result.textContent = '';
      instructions.textContent = "Attends que le carré devienne vert...";
      resetBox();

      const delay = Math.random() * 3000 + 1000; // entre 1 et 4 s

      timeoutId = setTimeout(() => {
        box.style.backgroundColor = '#27ae60'; // vert
        box.style.cursor = 'pointer';
        startTime = performance.now();
        ready = true;
        instructions.textContent = "Clique maintenant !";
      }, delay);
    }

    box.addEventListener('click', () => {
      if (!timeoutId) return;

      if (!ready) {
        clearTimeout(timeoutId);
        timeoutId = null;
        instructions.textContent = "Trop tôt ! Clique sur « Lancer le test » pour recommencer.";
        result.textContent = '';
        resetBox();
        return;
      }

      const reactionTime = Math.round(performance.now() - startTime);
      result.textContent = `Temps de réaction : ${reactionTime} ms`;
      instructions.textContent = "Clique sur « Lancer le test » pour rejouer.";
      clearTimeout(timeoutId);
      timeoutId = null;
      resetBox();
    });

    startBtn.addEventListener('click', () => {
      clearTimeout(timeoutId);
      timeoutId = null;
      startTest();
    });

    resetBox();
  </script>
</body>
</html>
