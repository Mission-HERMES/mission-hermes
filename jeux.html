<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test de réactivité</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #1e3c72, #2a5298);
      color: #f5f5f5;
    }

    .container {
      background: rgba(0, 0, 0, 0.35);
      padding: 2rem 2.5rem;
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
      max-width: 420px;
      width: 90%;
      backdrop-filter: blur(10px);
    }

    h1 {
      margin-bottom: 0.75rem;
      font-size: 1.8rem;
    }

    #instructions {
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      opacity: 0.9;
    }

    #box {
      width: 180px;
      height: 180px;
      margin: 0 auto 1.5rem;
      border-radius: 16px;
      background-color: #c0392b; /* rouge au départ */
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    #box:active {
      transform: scale(0.97);
    }

    #startBtn {
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: white;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      transition: transform 0.1s ease, box-shadow 0.1s ease, opacity 0.15s ease;
    }

    #startBtn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.45);
      opacity: 0.95;
    }

    #startBtn:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
    }

    #result {
      margin-top: 1rem;
      font-size: 1rem;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Test de réactivité</h1>
    <p id="instructions">
      Clique sur le carré <strong>dès qu'il devient vert</strong>.
    </p>

    <div id="box"></div>

    <button id="startBtn">Lancer le test</button>

    <p id="result"></p>
  </div>

  <script>
    const box = document.getElementById('box');
    const startBtn = document.getElementById('startBtn');
    const result = document.getElementById('result');
    const instructions = document.getElementById('instructions');

    let timeoutId = null;
    let startTime = null;
    let ready = false;

    function resetBox() {
      box.style.backgroundColor = '#c0392b'; // rouge
      box.style.cursor = 'not-allowed';
      ready = false;
    }

    function startTest() {
      result.textContent = '';
      instructions.textContent = "Attends que le carré devienne vert...";
      resetBox();

      const delay = Math.random() * 3000 + 1000; // entre 1 et 4 s

      timeoutId = setTimeout(() => {
        box.style.backgroundColor = '#27ae60'; // vert
        box.style.cursor = 'pointer';
        startTime = performance.now();
        ready = true;
        instructions.textContent = "Clique maintenant !";
      }, delay);
    }

    box.addEventListener('click', () => {
      if (!timeoutId) return;

      if (!ready) {
        clearTimeout(timeoutId);
        timeoutId = null;
        instructions.textContent = "Trop tôt ! Clique sur « Lancer le test » pour recommencer.";
        result.textContent = '';
        resetBox();
        return;
      }

      const reactionTime = Math.round(performance.now() - startTime);
      result.textContent = `Temps de réaction : ${reactionTime} ms`;
      instructions.textContent = "Clique sur « Lancer le test » pour rejouer.";
      clearTimeout(timeoutId);
      timeoutId = null;
      resetBox();
    });

    startBtn.addEventListener('click', () => {
      clearTimeout(timeoutId);
      timeoutId = null;
      startTest();
    });

    resetBox();
  </script>
</body>
</html>
