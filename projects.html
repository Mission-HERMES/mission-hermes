<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Projets – NovaSpace</title>
    <link rel="stylesheet" href="../novaspace.css">
</head>

<body>

<div class="layout">

    <!-- ─────────── Sidebar ─────────── -->
    <div class="sidebar">
        <a class="logo" href="../index.html">
            <div class="logo-mark"></div>
            NovaSpace
        </a>

        <div class="nav">
            <a class="nav-item active" href="projects.html">Projets</a>
            <a class="nav-item" href="messages.html">Messagerie</a>
            <a class="nav-item" href="notifications.html">Notifications</a>
            <a class="nav-item" href="profile.html">Profil</a>
        </div>

        <div class="sidebar-bottom">
            <div class="user-row">
                <div class="avatar" id="avatar"></div>
                <div>
                    <div class="user-name" id="usernameDisplay"></div>
                    <div class="user-handle">@nova</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ─────────── Main Feed ─────────── -->
    <div class="main">

        <div style="flex:1; max-width:700px; margin:auto;">

            <!-- Header -->
            <div class="feed-header">
                <div class="feed-title">Projets</div>
            </div>

            <!-- Composer -->
            <div class="compose">
                <textarea id="projectTitle" class="compose-input" placeholder="Titre du projet"></textarea>
                <textarea id="projectDesc" class="compose-input" placeholder="Décris ton projet..."></textarea>
                <button class="btn-primary" onclick="publishProject()">Publier</button>
            </div>

            <!-- Feed -->
            <div id="feed"></div>

        </div>

    </div>

</div>

<script src="../app.js"></script>

<script>

    // ─────────── Charger l'utilisateur connecté ───────────
    const user = localStorage.getItem("username");
    if (!user) window.location.href = "login.html";

    document.getElementById("usernameDisplay").innerText = user;
    document.getElementById("avatar").innerText = user[0].toUpperCase();


    // ─────────── Publier un projet ───────────
    async function publishProject() {
        const title = document.getElementById("projectTitle").value;
        const description = document.getElementById("projectDesc").value;

        if (!title || !description) return alert("Complète le titre et la description");

        await createProject(title, description, "", user);

        document.getElementById("projectTitle").value = "";
        document.getElementById("projectDesc").value = "";

        loadProjects();
    }


    // ─────────── Charger les projets ───────────
    async function loadProjects() {
        const feed = document.getElementById("feed");
        feed.innerHTML = "";

        const projects = await getAllProjects();

        projects.forEach(p => {
            feed.innerHTML += `
                <div class="post">
                    <div class="post-header">
                        <div class="post-avatar" style="background:var(--accent);">
                            ${p.author[0].toUpperCase()}
                        </div>
                        <div class="post-meta">
                            <div class="post-author">${p.author}</div>
                            <div class="post-time">${new Date(p.created_at).toLocaleString()}</div>
                        </div>
                    </div>

                    <div class="post-title">${p.title}</div>
                    <div class="post-body">${p.description}</div>

                    <div class="post-actions">
                        <button class="btn-ghost encourage">Encourager</button>
                        <button class="btn-ghost" onclick="openComments(${p.id})">Commentaires</button>
                    </div>
                </div>
            `;
        });
    }

    loadProjects();


    // ─────────── Ouvrir les commentaires ───────────
    function openComments(id) {
        window.location.href = "project_comments.html?id=" + id;
    }

</script>

</body>
</html>
