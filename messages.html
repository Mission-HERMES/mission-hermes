<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Messagerie – NovaSpace</title>
    <link rel="stylesheet" href="../novaspace.css">
</head>

<body>

<div class="layout">

    <!-- ─────────── Sidebar ─────────── -->
    <div class="sidebar">
        <a class="logo" href="../index.html">
            <div class="logo-mark"></div>
            NovaSpace
        </a>

        <div class="nav">
            <a class="nav-item" href="projects.html">Projets</a>
            <a class="nav-item active" href="messages.html">Messagerie</a>
            <a class="nav-item" href="notifications.html">Notifications</a>
            <a class="nav-item" href="profile.html">Profil</a>
        </div>

        <div class="sidebar-bottom">
            <div class="user-row">
                <div class="avatar" id="avatar"></div>
                <div>
                    <div class="user-name" id="usernameDisplay"></div>
                    <div class="user-handle">@nova</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ─────────── Main Messagerie ─────────── -->
    <div class="main">

        <div class="msg-layout">

            <!-- ─────────── Liste des conversations ─────────── -->
            <div class="conv-list" id="convList"></div>

            <!-- ─────────── Zone de chat ─────────── -->
            <div class="chat-area">

                <div class="chat-header">
                    <div class="chat-name" id="chatName">Sélectionne une conversation</div>
                </div>

                <div class="chat-messages" id="chatMessages"></div>

                <div class="chat-input-area">
                    <textarea id="msgInput" class="chat-input" placeholder="Écrire un message..."></textarea>
                    <button class="send-btn" onclick="sendMsg()">➤</button>
                </div>

            </div>

        </div>

    </div>

</div>

<script src="../app.js"></script>

<script>

    // ─────────── Récupération utilisateur ───────────
    const user = localStorage.getItem("username");
    if (!user) window.location.href = "login.html";

    document.getElementById("usernameDisplay").innerText = user;
    document.getElementById("avatar").innerText = user[0].toUpperCase();


    // ─────────── Charger la liste des conversations ───────────
    let currentChat = null;

    async function loadConversations() {
        const convList = document.getElementById("convList");
        convList.innerHTML = "";

        const inbox = await getInbox(user); // Fonction à ajouter dans app.js

        inbox.forEach(contact => {
            convList.innerHTML += `
                <div class="conv-item" onclick="openChat('${contact}')">
                    <div class="conv-avatar" style="background:var(--accent);">
                        ${contact[0].toUpperCase()}
                    </div>
                    <div class="conv-info">
                        <div class="conv-name">${contact}</div>
                        <div class="conv-preview">Voir la conversation</div>
                    </div>
                </div>
            `;
        });
    }


    // ─────────── Ouvrir une conversation ───────────
    async function openChat(contact) {
        currentChat = contact;
        document.getElementById("chatName").innerText = contact;
        loadMessages();
    }


    // ─────────── Charger les messages ───────────
    async function loadMessages() {
        if (!currentChat) return;

        const messages = await getConversation(user, currentChat);
        const box = document.getElementById("chatMessages");

        box.innerHTML = "";

        messages.forEach(m => {
            const mine = m.sender === user;

            box.innerHTML += `
                <div class="msg-group ${mine ? "mine" : ""}">
                    <div class="msg-avatar" style="background:var(--accent);">
                        ${m.sender[0].toUpperCase()}
                    </div>

                    <div class="msg-bubble-wrap">
                        <div class="msg-bubble ${mine ? "mine" : "theirs"}">
                            ${m.content}
                        </div>
                        <div class="msg-time">${new Date(m.created_at).toLocaleTimeString()}</div>
                    </div>
                </div>
            `;
        });

        box.scrollTop = box.scrollHeight;
    }


    // ─────────── Envoyer un message ───────────
    async function sendMsg() {
        const content = document.getElementById("msgInput").value;
        if (!content || !currentChat) return;

        await sendMessage(user, currentChat, content);

        document.getElementById("msgInput").value = "";
        loadMessages();
    }


    // ─────────── Fonction manquante dans app.js : inbox ───────────
    async function getInbox(username) {
        const res = await fetch(`http://127.0.0.1:8000/messages/inbox/${username}`);
        return res.json();
    }


    // ─────────── Initialisation ───────────
    loadConversations();

</script>

</body>
</html>
