<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Inscription – NovaSpace</title>
    <link rel="stylesheet" href="../novaspace.css">
</head>

<body style="display:flex;justify-content:center;align-items:center;height:100vh;background:var(--bg);">

    <div class="signup-panel" style="
        width: 340px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 32px 28px;
        box-shadow: 0 0 30px var(--shadow);
    ">

        <h2 style="
            text-align:center;
            font-size:18px;
            font-weight:600;
            margin-bottom:24px;
            color:var(--text);
        ">Créer un compte</h2>

        <input id="username" type="text" placeholder="Nom d'utilisateur" class="search-input" style="margin-bottom:14px;width:100%;">

        <input id="password" type="password" placeholder="Mot de passe" class="search-input" style="margin-bottom:14px;width:100%;">

        <input id="password2" type="password" placeholder="Confirmer le mot de passe" class="search-input" style="margin-bottom:18px;width:100%;">

        <button onclick="handleSignup()" class="btn-primary" style="width:100%;justify-content:center;">
            S'inscrire
        </button>

        <div id="error" style="
            margin-top:14px;
            text-align:center;
            color:#ff4a4a;
            font-size:13px;
        "></div>

        <div style="margin-top:18px;text-align:center;font-size:13px;color:var(--text-3);">
            Déjà un compte ?
            <a href="login.html" style="color:var(--accent);text-decoration:none;">Se connecter</a>
        </div>

    </div>

    <script src="../app.js"></script>

    <script>
        async function handleSignup() {
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;
            const pass2 = document.getElementById("password2").value;

            if (pass !== pass2) {
                document.getElementById("error").innerText = "Les mots de passe ne correspondent pas";
                return;
            }

            const result = await register(user, pass);

            if (result.status === "ok") {
                localStorage.setItem("username", user);
                window.location.href = "login.html";
            } else {
                document.getElementById("error").innerText = "Nom d'utilisateur déjà pris";
            }
        }
    </script>

</body>
</html>
